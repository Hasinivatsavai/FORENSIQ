name: forensiq
services:
  app:
    build: .
    environment:
      FORENSIQ_DB_PATH: /service/data/forensiq.sqlite3
      COOKIE_SECURE: "false"
      PORT: "8080"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - sqlite_data:/service/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
volumes:
  sqlite_data:
